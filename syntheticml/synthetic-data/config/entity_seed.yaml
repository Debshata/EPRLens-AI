# Scenario codes -> descriptions (also in docs/dummy-entities.md)
test_scenarios:
  TS01_UNREGISTERED_RECYCLER: "Unregistered recycler carrying a claimed SYN-PWP number; used by COMP_0003 (AN13)"
  TS02_SUPPLIER_ABNORMAL_QUANTITY: "PET bottle supplier with irregular x5 quantity spikes; secondary supplier of COMP_0001 (AN09/AN01)"
  TS03_SUPPLIER_MATERIAL_CHANGE: "Cap supplier whose master says PP only; later invoices switch to HDPE from 2025-07 (AN20/AN03)"
  TS04_BUYER_INCOMPLETE_REGISTRATION: "Distributor with a truncated 14-character GSTIN and no EPR registration; buyer of COMP_0001 (AN06)"
  TS05_STALE_PACKAGING_WEIGHT: "Snack pouch v1 6.5 g superseded by v2 5.2 g on 2025-01-01; masters still using v1 are stale (AN18)"

test_user_roles_core: [company_admin, sustainability_manager, compliance_manager, consultant, demo_user]

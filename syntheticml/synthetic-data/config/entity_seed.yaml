# Entity-master configuration — SYNTHETIC — EPRLens Demo
# Status: PROPOSED. Values follow the recommended options in docs/DECISIONS-REQUIRED.md.
# Changing any value and re-running generate_entities.py regenerates every master deterministically.

seed: 20261009
generator_version: "0.2.1-entities"
window: {start: "2023-04-01", end: "2026-03-31"}        # DS-01 B

# The "core" pack is generated identically in both modes, so its IDs are stable
# for the demo company, frontend mocks and AWS test events.
packs:
  test:  {companies: 5,   suppliers: 10,  buyers: 10,  recyclers: 5,  test_users: 5}
  full:  {companies: 200, suppliers: 120, buyers: 150, recyclers: 50, test_users: 15}

products_per_company: {min: 3, max: 15}

industry_weights:            # DS-15 A — illustrative, deliberately unequal
  FMCG: 14
  Food: 14
  Beverages: 9
  Personal Care: 9
  Pharmaceuticals: 9
  Electronics: 7
  Automotive: 6
  Cosmetics: 6
  Retail: 6
  E-commerce: 6
  Household Products: 6
  Appliances: 5
  Industrial Goods: 3

state_weights:               # HQ-state weights — illustrative
  Maharashtra: 16
  Gujarat: 10
  Tamil Nadu: 9
  Karnataka: 8
  Uttar Pradesh: 8
  Delhi: 7
  Haryana: 7
  West Bengal: 5
  Telangana: 5
  Rajasthan: 4
  Punjab: 3
  Madhya Pradesh: 3
  Andhra Pradesh: 3
  Kerala: 2
  Himachal Pradesh: 2
  Uttarakhand: 2
  Goa: 1
  Odisha: 2
  Assam: 1
  Bihar: 2

turnover: {median_cr: 40, sigma: 1.4, min_cr: 0.5, max_cr: 2500}   # DS-14 A
size_bands_cr: {micro: 5, small: 50, medium: 250}                 # upper bounds; above = large
msme_probability: {micro: 0.85, small: 0.85, medium: 0.4, large: 0.0}
states_operated_range: {micro: [1, 2], small: [1, 4], medium: [3, 8], large: [6, 14]}
epr_registered_probability: {micro: 0.4, small: 0.55, medium: 0.75, large: 0.9}

role_probabilities:          # business facts, not regulatory conclusions
  manufacturer: {default: 0.75, Retail: 0.3, E-commerce: 0.25, Electronics: 0.4, Appliances: 0.6}
  importer: {default: 0.15, Electronics: 0.6, Appliances: 0.5, Automotive: 0.3, Cosmetics: 0.3, E-commerce: 0.3}
  brand_owner: {default: 0.85, Industrial Goods: 0.4, E-commerce: 0.5}

recyclers:
  unregistered_share: 0.16   # DS-22 A (8 of 50 in full mode)
  capacity_kg_median: 150000

spec_version_share: 0.08     # components that get a lighter v2 mid-window


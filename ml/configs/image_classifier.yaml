model:
  name: mobilenet_v3_small
  version: mobilenetv3-v1
  pretrained: true
  num_classes: 7
  image_size: 224

dataset:
  manifest: ml/datasets/image_manifest.csv
  train_split: train
  validation_split: validation
  test_split: test
  seed: 42

training:
  batch_size: 32
  epochs: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  freeze_backbone: true
  early_stopping_patience: 2

inference:
  confidence_threshold: 0.60
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || true
            - node -v
            - npm ci
        build:
          commands:
            # Amplify does not pass console env vars to the SSR runtime by itself: write the ones the server code reads.
            # (No AWS keys here: the server uses the Amplify compute IAM role.)
            - env | grep -E '^(UPLOADS_BUCKET|LAMBDA_[A-Z_]+|NEXT_PUBLIC_[A-Z_]+)=' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
